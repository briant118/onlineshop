{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block body_class %}login-bg{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}" />
{% endblock %}

{% block content %}
  <div class="row justify-content-center py-4 py-md-5">
    <div class="col-12" style="max-width: 430px; margin-left: auto; margin-right: auto">
      <div class="card login-card w-100">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 text-center login-title mb-2">Welcome back</h1>
          <p class="text-center login-subtitle mb-4">
            Sign in to continue to your account.
          </p>

          <form action="" method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input
                type="text"
                class="form-control login-input"
                id="username"
                name="username"
                autocomplete="username"
                required
              />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input
                type="password"
                class="form-control login-input"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
